# @package _global_
# Go2-Chase-Flat of go2-supermimic (env/env_cfg.py go2_chase_env_cfg) on UniLab; the
# obstacles and terrain tasks extend this file.
env:
  seed: null
  scene:
    model_file: src/unisupermimic/assets/robots/go2/scene_go2_chase.xml
    default_keyframe_name: home
    entities:
      robot:
        root_body_name: base
        joint_names: &go2_joints
          - FL_hip_joint
          - FL_thigh_joint
          - FL_calf_joint
          - FR_hip_joint
          - FR_thigh_joint
          - FR_calf_joint
          - RL_hip_joint
          - RL_thigh_joint
          - RL_calf_joint
          - RR_hip_joint
          - RR_thigh_joint
          - RR_calf_joint
        actuator_names: [FL_hip, FL_thigh, FL_calf, FR_hip, FR_thigh, FR_calf, RL_hip, RL_thigh, RL_calf, RR_hip, RR_thigh, RR_calf]
        # base, then hips (thigh frames) and knees (calf frames), legs FR FL RR RL
        body_names: [base, FR_thigh, FL_thigh, RR_thigh, RL_thigh, FR_calf, FL_calf, RR_calf, RL_calf]
        geom_names: [FR_foot_collision, FL_foot_collision, RR_foot_collision, RL_foot_collision]
  sim_dt: 0.005
  ctrl_dt: 0.02
  max_episode_seconds: 20.0
  auto_reset: true
  scale_rewards_by_dt: true
  observations:
    policy:
      enable_corruption: true
      history_length: 5   # per term, oldest -> newest (mjlab layout)
      terms:
        base_ang_vel:
          func: unisupermimic.go2chase.env.terms.base_ang_vel
          noise: {_target_: unilab.managers.UniformNoiseCfg, n_min: -0.2, n_max: 0.2}
        projected_gravity:
          func: unisupermimic.go2chase.env.terms.projected_gravity
          noise: {_target_: unilab.managers.UniformNoiseCfg, n_min: -0.05, n_max: 0.05}
        joint_pos:
          func: unilab.envs.mdp.joint_pos_rel
          params: {biased: true}
          noise: {_target_: unilab.managers.UniformNoiseCfg, n_min: -0.01, n_max: 0.01}
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
          noise: {_target_: unilab.managers.UniformNoiseCfg, n_min: -1.5, n_max: 1.5}
        actions:
          func: unilab.envs.mdp.last_action
        target:
          func: unisupermimic.go2chase.env.terms.target_observation
          params: {command_name: target}
  actions:
    joint_pos:
      _target_: unilab.envs.mdp.JointPositionActionCfg
      entity_name: robot
      actuator_names: [".*"]
      scale: {".*_hip_joint": 0.3349008680922322, ".*_thigh_joint": 0.3349008680922322, ".*_calf_joint": 0.2853173265340854}
      use_default_offset: true
  commands:
    target:
      _target_: unisupermimic.go2chase.env.command.TargetCommandCfg
      entity_name: robot
      task: flat
      resampling_time_range: [2.0, 5.0]
      mode_probs: [0.3, 0.3, 0.4]
  events:
    startup_context:
      _target_: unilab.managers.EventTermCfg
      func: unisupermimic.go2chase.env.terms.Go2ContextEvent
      mode: startup
      params: {command_name: target}
    reset_context:
      _target_: unilab.managers.EventTermCfg
      func: unisupermimic.go2chase.env.terms.Go2ContextEvent
      mode: reset
      params: {command_name: target}
    reset_scene_to_default:
      func: unilab.envs.mdp.reset_scene_to_default
      mode: reset
    reset_base:   # mjlab reset_root_state_uniform around the arena centre (terrain: tile origin)
      func: unisupermimic.go2chase.env.terms.reset_base
      mode: reset
      params:
        pose_range: {x: [-0.5, 0.5], y: [-0.5, 0.5], z: [0.01, 0.05], yaw: [-3.14, 3.14]}
  terminations:
    time_out:
      func: unilab.envs.mdp.time_out
      time_out: true
    fell_over:
      func: unilab.envs.mdp.bad_orientation
      params: {limit_angle: 1.2217304763960306}   # 70 degrees
  policy_observation_group: policy
  critic_observation_group: null

# go2-supermimic env_cfg.py weights (each reward is scaled by the step dt)
reward:
  chase_approach:
    func: unisupermimic.go2chase.env.terms.chase_approach
    weight: 1.5
    params: {command_name: target, max_speed: 5.0}
  chase_tag:
    func: unisupermimic.go2chase.env.terms.chase_tag
    weight: 15.0
    params: {command_name: target}
  facing_target:
    func: unisupermimic.go2chase.env.terms.facing_target
    weight: 0.5
    params: {command_name: target}
  evade_danger:
    func: unisupermimic.go2chase.env.terms.evade_danger
    weight: -2.0
    params: {command_name: target, std: 0.4}
  hit:
    func: unisupermimic.go2chase.env.terms.hit
    weight: -100.0
    params: {command_name: target}
  evade_anticipate:
    func: unisupermimic.go2chase.env.terms.evade_anticipate
    weight: -1.5
    params: {command_name: target, std: 0.3}
  outside_arena:
    func: unisupermimic.go2chase.env.terms.outside_arena
    weight: -2.0
    params: {command_name: target, margin: 0.5}
  upright:
    func: unisupermimic.go2chase.env.terms.upright
    weight: 1.0
    params: {std: 0.4}
  tilt_rate_l2:
    func: unisupermimic.go2chase.env.terms.tilt_rate_l2
    weight: -0.05
  hard_landing:
    func: unisupermimic.go2chase.env.terms.hard_landing
    weight: -0.5
  crouch:
    func: unisupermimic.go2chase.env.terms.crouch
    weight: -30.0
    params: {command_name: target}
  joint_deviation_l2:
    func: unisupermimic.go2chase.env.terms.joint_deviation_l2
    weight: -0.1
  base_height_low:
    func: unisupermimic.go2chase.env.terms.base_height_low
    weight: -10.0
    params: {min_height: 0.18}
  terminated:
    func: unilab.envs.mdp.is_terminated
    weight: -200.0
  action_rate_l2:
    func: unilab.envs.mdp.action_rate_l2
    weight: -0.05
  dof_pos_limits:
    func: unisupermimic.go2chase.env.terms.joint_pos_limits
    weight: -1.0
  joint_torques_l2:
    func: unisupermimic.go2chase.env.terms.JointTorquesL2
    weight: -2.0e-5
  joint_acc_l2:
    func: unisupermimic.go2chase.env.terms.JointAccL2
    weight: -2.5e-7
