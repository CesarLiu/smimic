defaults:
  - _self_
  - task: g1_super_mimic/mjwarp

algo:
  algo: supermimic
  algo_log_name: supermimic
  load_run: "-1"
  checkpoint: -1
  resume: false
  seed: 0
  num_envs: 4096
  iterations: 12000
  buffer_steps: 1000
  utd: 0.4
  horizon: 32
  goal_frames: 10
  hist: 10
  z_dim: 32
  wm_hidden: [2048, 2048, 2048]
  policy_hidden: [2048, 1024, 512, 256]
  critic_hidden: [256, 128]
  wm_window: 8
  wm_batches: 10
  wm_batch: 2048
  pi_batch: 4096
  lr: 2.0e-4
  gamma: 0.99
  lam: 0.95
  action_noise: 0.1
  critic_epochs: 5
  critic_minibatches: 4
  no_critic: false
  warmup_steps: 64
  wm_only_iters: 500
  lr_decay_iters: 250000
  ckpt_every: 2000
  log_every: 50
  log_backend: tensorboard
  amp: bf16
  compile: true
  test_hidden_dims: null
  # imagined root-velocity kicks (analytic push injection); 0 = off, as in the paper
  imag_push_rate: 0.0
  imag_push_scale: 1.0

# push test for evaluation (training.play_only=true): a horizontal root-velocity kick of
# push_speed m/s every push_every steps, directions from push_seed (identical for every policy)
eval:
  push_speed: 0.0
  push_every: 150
  push_seed: 0

training:
  task_name: G1SuperMimic
  sim_backend: mjwarp
  collector_tensor_device: auto
  play_only: false
  no_play: true
  sim2sim_strict: true
  play_render_mode: none
  play_env_num: 40
  log_root: null
  log_dir: null

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]
