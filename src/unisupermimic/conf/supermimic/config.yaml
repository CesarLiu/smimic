defaults:
  - _self_
  - task: g1_super_mimic/mjwarp

algo:
  algo: supermimic
  algo_log_name: supermimic
  load_run: "-1"
  checkpoint: -1
  resume: false
  seed: 0
  num_envs: 4096
  iterations: 12000
  buffer_steps: 1000
  utd: 0.4
  horizon: 32
  goal_frames: 10
  hist: 10
  z_dim: 32
  wm_hidden: [2048, 2048, 2048]
  policy_hidden: [2048, 1024, 512, 256]
  critic_hidden: [256, 128]
  wm_window: 8
  wm_batches: 10
  wm_batch: 2048
  pi_batch: 4096
  lr: 2.0e-4
  gamma: 0.99
  lam: 0.95
  action_noise: 0.1
  critic_epochs: 5
  critic_minibatches: 4
  no_critic: false
  warmup_steps: 64
  wm_only_iters: 500
  lr_decay_iters: 250000
  ckpt_every: 2000
  log_every: 50
  log_backend: tensorboard
  amp: bf16
  compile: true
  test_hidden_dims: null
  # imagined root-velocity kicks (analytic push injection); 0 = off, as in the paper
  imag_push_rate: 0.0
  imag_push_scale: 1.0
  # training techniques from go2-supermimic (all off by default = the paper; see
  # SuperMimicConfig in rl/algos/supermimic/learner.py and docs/H200_RUNBOOK.md)
  wm_prioritized_frac: 0.0      # rare-event world-model batches: rarest of 4x candidates
  wm_archive_frac: 0.0          #   and an archive of rare windows (flight, landings, falls)
  archive_size: 50000
  archive_keep_prob: 0.02
  contact_height: 0.10          # ankle-link height; 0.065 counts toe stands as flight
  hard_vz: 0.6
  explore_frac: 0.0             # envs collecting with Ornstein-Uhlenbeck action noise
  explore_noise: 0.3
  explore_theta: 2.0
  actor_lr_scale: 1.0           # stability: actor lr multiplier, ramp, collapse guard
  actor_ramp_iters: 0
  collapse_fall_rate: 0.0       # falls per 1000 env steps; 0 = off
  collapse_snapshot_every: 500
  init_from: null               # warm start from a checkpoint (weights only)
  reset_critic: false
  critic_warmup_iters: 500
  wm_rewarmup_iters: 1500
  driver_ckpt: null             # data-collection driver policy (SuperMimic or PPO-Sim)
  driver_frac: 0.0
  driver_fade: [1000000000, 1000000000]

# PPO-Sim baseline (scripts/train_ppo.py): BeyondMimic's PPO on SuperMimic's task; network
# sizes and inputs come from algo.* so both methods use identical actor and critic networks.
ppo:
  num_envs: 8192          # per GPU, twice SuperMimic's (paper §4.1)
  steps_per_env: 24
  epochs: 5
  minibatches: 4
  lr: 1.0e-3              # adaptive on the KL
  desired_kl: 0.01
  clip: 0.2
  value_coef: 1.0
  entropy_coef: 0.005
  init_std: 1.0
  max_grad_norm: 1.0
  iterations: 1000000000
  max_hours: 18.0         # Fig. 4a budget
  ckpt_minutes: 30.0
  log_every: 10

# push test for evaluation (training.play_only=true): a horizontal root-velocity kick of
# push_speed m/s every push_every steps, directions from push_seed (identical for every policy)
eval:
  max_envs: 8192          # evaluate in chunks of this many clips (BONES-SEED has 129,514)
  push_speed: 0.0
  push_every: 150
  push_seed: 0

training:
  task_name: G1SuperMimic
  sim_backend: mjwarp
  collector_tensor_device: auto
  play_only: false
  no_play: true
  sim2sim_strict: true
  play_render_mode: none
  play_env_num: 40
  log_root: null
  log_dir: null

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]
